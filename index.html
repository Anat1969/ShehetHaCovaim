<!doctype html>
<html lang="he" dir="rtl" data-theme="obsidian">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ששת הכובעים | מסע חשיבה מטרה לצעד</title>
    <meta name="description" content="משחק חשיבה לפי שיטת ששת הכובעים של אדוארד דה בונו. שישה חדרים שהופכים מטרה לצעד אחד עם תאריך." />
    <meta name="theme-color" content="#0a0a0b" />
    <meta property="og:title" content="ששת הכובעים" />
    <meta property="og:description" content="שש זוויות חשיבה על מטרה אחת. בסוף: צעד אחד שאי אפשר לא לעשות." />
    <meta property="og:type" content="website" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@200;300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      try {
        var s = JSON.parse(localStorage.getItem("hats-v2") || "null");
        var t = s && s.state && s.state.theme;
        if (!t) t = matchMedia("(prefers-color-scheme: light)").matches ? "chalk" : "obsidian";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
